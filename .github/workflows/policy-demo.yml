name: policy-demo
on: pull_request
permissions:
  contents: read
jobs:
  tag-ref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
  not-allowed:
    runs-on: ubuntu-24.04
    steps:
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
