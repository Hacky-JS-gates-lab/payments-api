# Calls the org's central security gate. Owned by the security team (CODEOWNERS).
# Don't edit by hand: the security team bumps it with a PR per repo.
name: security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: Hacky-JS-gates-lab/security-workflows/.github/workflows/security-gate.yml@83358c4736ced246771f22e62bf6ee37d77d0d06 # v1.2.0
    with:
      mode: block
