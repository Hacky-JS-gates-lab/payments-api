# Calls the org's central security gate. Owned by the security team (CODEOWNERS).
# Don't edit by hand: the security team bumps it with a PR per repo.
name: security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: Hacky-JS-gates-lab/security-workflows/.github/workflows/security-gate.yml@e713f67939a45f892c443e603ce04f19cc6bf750 # v2.2.0
    with:
      mode: block
