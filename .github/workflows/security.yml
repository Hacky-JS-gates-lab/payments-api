# Calls the org's central security gate. Owned by the security team (CODEOWNERS).
# Don't edit by hand: the security team bumps it with a PR per repo.
name: security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: Hacky-JS-gates-lab/security-workflows/.github/workflows/security-gate.yml@f88f41c7d21d50201be56d54485d8b0bdd3c02bf # v2.0.1
    with:
      mode: block
