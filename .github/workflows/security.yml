# Calls the org's central security gate. Owned by the security team (CODEOWNERS).
# Don't edit by hand: the security team bumps it with a PR per repo.
name: security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: Hacky-JS-gates-lab/security-workflows/.github/workflows/security-gate.yml@3392f21971e8605f2a1dc520e6732fbea3332b21 # v1.1.0
    with:
      mode: block
