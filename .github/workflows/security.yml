# Calls the org's central security gate. Owned by the security team (CODEOWNERS).
# Don't edit by hand: the security team bumps it with a PR per repo.
name: security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      security-events: write # gate v2.3.0+: zizmor findings to code scanning
    uses: Hacky-JS-gates-lab/security-workflows/.github/workflows/security-gate.yml@117d02beff32eea73e10d8489f60992366e3d228 # v2.3.0
    with:
      mode: block
