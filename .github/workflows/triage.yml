# Comment triage for merge-gate-lab. The comment body is data: it reaches the shell only through $COMMENT.
# The guard limits it to org members and the owner so strangers cannot trigger it.
name: triage
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] members-only guard, no token permissions, no secrets
    types: [created]

permissions: {}

jobs:
  label:
    if: contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Parse command
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          echo "Comment: $COMMENT"
