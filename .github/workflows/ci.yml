# Deliberately weak workflow for merge-gate-lab. Every problem here is a lesson.
# The `if:` guard on each job keeps PRs from forks out, so a public lab repo cannot
# be attacked by strangers. Remove the guard and this becomes a real "pwn request".
name: ci
on:
  pull_request_target:
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Announce
        run: echo "Tested ${{ github.event.pull_request.title }}"
