# CI for merge-gate-lab. Runs on pull_request: PR code gets a read-only token and no secrets.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Announce
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "Tested ${TITLE:-$GITHUB_REF_NAME}"
